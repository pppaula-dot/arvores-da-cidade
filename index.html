<script>
(function () {
  var t0 = Date.now(), MIN = 3000, done = false;
  window.AC = window.AC || {};
  window.AC.hideSplash = function () {
    if (done) return; done = true;
    var left = Math.max(0, MIN - (Date.now() - t0));
    setTimeout(function () {
      var s = document.getElementById('splash'); if (!s) return;
      s.classList.add('off'); setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
    }, left);
  };
  setTimeout(function () { window.AC.hideSplash(); }, 7000);
})();
</script>
